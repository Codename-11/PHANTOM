# PHANTOM — Phase 1 container substrate.
#
# Single `phantom` service. Named volumes only — no bind mounts, per the
# locked decisions in ai_sync/containerization.md. Env passthrough lets the
# host inject API_BASE_URL / API_KEY / MODEL_ID without baking secrets into
# the image. Build args for toolpack profiles arrive in Phase 3.

services:
  phantom:
    build: .
    image: phantom:base
    ports:
      - "1337:1337"
    environment:
      # Honored by server/config.js — falls through to provider defaults if unset.
      API_BASE_URL: ${API_BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
    volumes:
      # Operator artifacts, run outputs, scratch.
      - phantom-workspace:/app/workspace
      # SQLite DB + WAL/SHM. The Dockerfile sets PHANTOM_DB_PATH to
      # /app/data/phantom.db, and server/config.js threads that through to
      # better-sqlite3, so the file actually lives on this named volume and
      # survives `docker compose down`. WAL/SHM siblings land next to it.
      - phantom-db:/app/data
    restart: unless-stopped

volumes:
  phantom-workspace:
  phantom-db:
